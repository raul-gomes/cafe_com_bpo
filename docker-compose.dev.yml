# Desenvolvimento local — NÃO é carregado automaticamente.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Adiciona ferramentas de dev (mailpit, pgadmin), publica o Postgres no host,
# monta o código por volume (hot-reload) e roda a web em modo dev (Vite).
services:
  db:
    ports:
      - "5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./apps/backend
    environment:
      - MODE=development
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/tests:/app/tests
      - ./apps/backend/alembic:/app/alembic

  web:
    build:
      context: ./apps/frontend
      target: development
      args:
        VITE_PIX_KEY: ${VITE_PIX_KEY}
    # Vite dev server lê VITE_* do ambiente em runtime
    environment:
      - VITE_PIX_KEY=${VITE_PIX_KEY}
    # Porta 80 interna para casar com o upstream do gateway (web:80)
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80", "--strictPort"]
    expose:
      - "80"
    # Vite dev consome bem mais que o limite de produção (64m)
    mem_limit: 512m
    volumes:
      - ./apps/frontend/src:/app/src
      - ./apps/frontend/index.html:/app/index.html
      - ./apps/frontend/vite.config.ts:/app/vite.config.ts
      - ./apps/frontend/tsconfig.json:/app/tsconfig.json
      - ./apps/frontend/postcss.config.js:/app/postcss.config.js
      - ./apps/frontend/tailwind.config.js:/app/tailwind.config.js
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"
    expose:
      - "1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgadmin_data:
