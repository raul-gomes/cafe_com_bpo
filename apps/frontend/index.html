<!doctype html>
<html lang="pt-BR" data-cafe-palette="cafe" data-cafe-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Identidade Café com BPO V4: servida sem alteração a partir de public/brand/kit-v4
         (ordem do GUIA-DE-USO). Fica fora do PostCSS porque o kit usa @layer base/components/
         utilities, nomes que o Tailwind v3 tentaria processar. -->
    <!-- Ordem de camadas: o reset do Tailwind (tw-base) fica abaixo de todas as do kit. -->
    <style>@layer tw-base;</style>
    <link rel="preload" href="/brand/kit-v4/fonts/DM-Sans.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/brand/kit-v4/cafe-design-system.css" />
    <link rel="stylesheet" href="/brand/kit-v4/cafe-themes.css" />
    <link rel="stylesheet" href="/brand/kit-v4/cafe-expression.css" />
    <link rel="stylesheet" href="/brand/kit-v4/cafe-navigation.css" />
    <script>
      /* Aplica o modo salvo antes da primeira pintura (evita piscar o tema errado).
         Mesma chave e formato de src/brand/appearance.ts. */
      (function () {
        try {
          var v = JSON.parse(localStorage.getItem('cafe-appearance') || '{}') || {};
          /* Só claro/escuro: a família de cor é sempre Café (data-cafe-palette fixo no <html>). */
          if (['light', 'dark'].indexOf(v.mode) >= 0) document.documentElement.dataset.cafeMode = v.mode;
        } catch (e) { /* armazenamento indisponível: fica o padrão */ }
      })();
    </script>
    <title>Café com BPO · Inteligência de negócio para o BPO financeiro</title>
    <!-- SEO padrão (página inicial). As demais páginas trocam estas tags em src/lib/seo.ts.
         Robôs que não executam JavaScript (prévia de link no WhatsApp/LinkedIn) leem só isto. -->
    <meta name="description" content="Comunidade, ferramenta e precificação para quem opera BPO financeiro. Inteligência de negócio não é IA: é você com a realidade. Seja Beta do Café com BPO." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#35291F" />
    <link rel="canonical" href="https://cafecombpo.cloud/" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Google Search Console: site ownership check (URL-prefix property).
         The Domain property is verified by the DNS TXT record instead — see GUIA-GOOGLE.md. -->
    <meta name="google-site-verification" content="4j7u8YoCDlsVS1HQfK1KmFD2Mgdx3mYkASyg9YsIJC8" />
    <!-- Google AdSense (publisher ca-pub-9822124118535028). Must stay in the page head:
         AdSense looks for it here to verify the site. Ads only show after they are
         set up in the AdSense dashboard; exclude /painel there (see GUIA-GOOGLE.md). -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9822124118535028" crossorigin="anonymous"></script>
