# Gateway de desenvolvimento (HTTP, sem certificado), usado pelo
# docker-compose.dev.yml. Mesmas rotas do nginx.conf de produção:
#   /      -> web (Vite dev server, com WebSocket para o hot-reload)
#   /api/  -> api (remove o prefixo /api)
# Ajustes pessoais vão em nginx.conf.local, que não é versionado.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Uploads: the API accepts up to 20 MB (task attachments) and 10 MB
    # (gallery). Nginx defaults to 1 MB and answered an HTML 413 first (AUD-028).
    client_max_body_size 25m;

    upstream backend_api {
        server api:8000;
    }

    upstream frontend_web {
        server web:80;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://frontend_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/ {
            proxy_pass http://backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support: disable buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }
    }
}
