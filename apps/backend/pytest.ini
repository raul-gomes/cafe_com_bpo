[pytest]
asyncio_mode = auto
# A suíte padrão não toca rede: testes de integração (Cloudinary, Resend)
# só rodam com `pytest -m integration` e credenciais reais no .env.
# Um `-m` explícito na linha de comando sobrepõe esta expressão.
addopts = -m "not integration"
markers =
    integration: testes de integração (chamam APIs reais, requer .env com chaves)
